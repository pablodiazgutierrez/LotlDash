   LOTL DASH — dig, dodge, grab the pearls.
   A rocks-and-pearls cave digger starring the lotls from Lotl Quest.
   Single file, no dependencies. Runs from file:// or any host.
   ============================================================ */

/* ---------- world / viewport ---------- */
const H = 720;                 // logical height, always
let W = 1280;                  // logical width, from aspect
let scale = 1, offX = 0, offY = 0, DPR = 1;
let spritesFor = '';

function resize() {
  const cw = window.innerWidth, ch = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(880, Math.min(1700, Math.round(H * (cw / ch))));
  cvs.width = Math.round(cw * DPR);
  cvs.height = Math.round(ch * DPR);
  cvs.style.width = cw + 'px';
  cvs.style.height = ch + 'px';
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2;
  offY = (ch - H * scale) / 2;
  spritesFor = '';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
const toWorld = (cx, cy) => ({ x: (cx - offX) / scale, y: (cy - offY) / scale });

/* ---------- tiny helpers ---------- */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   SOUND — tiny WebAudio blips, plus a soft looping tune
   ============================================================ */
const Snd = {
  ac: null, master: null, noiseBuf: null,
  boot() {
    if (!this.ac) {
      try {
        this.ac = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ac.createGain(); this.master.gain.value = 0.9;
        this.master.connect(this.ac.destination);
        const n = this.ac.sampleRate, b = this.ac.createBuffer(1, n, n), d = b.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = b;
      } catch (e) { this.ac = null; }
    }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
    Music.start();
  },
  ok() { return this.ac && !save.mute && !G.silent; },
  env(g, t, vol, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  blip(freq, dur, type, vol, delay) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    this.env(g, t, vol == null ? 0.15 : vol, dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
  },
  slide(f1, f2, dur, type, vol, delay) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    this.env(g, t, vol == null ? 0.16 : vol, dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, freq, vol, freq2, delay) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + (delay || 0);
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t);
    if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t + dur);
    const g = this.ac.createGain();
    this.env(g, t, vol, dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  // the named effects
  dig()    { this.noise(0.07, 900, 0.07); },
  pearl(n) { const f = 880 * Math.pow(1.06, Math.min(n, 20)); this.blip(f, 0.12, 'sine', 0.11); this.blip(f * 1.5, 0.1, 'triangle', 0.04, 0.03); },
  land()   { this.slide(150, 55, 0.14, 'sine', 0.22); this.noise(0.08, 500, 0.08); },
  clink()  { this.blip(1500, 0.05, 'triangle', 0.06); },
  push()   { this.noise(0.14, 380, 0.13); },
  boom()   { this.noise(0.6, 1800, 0.32, 80); this.slide(140, 35, 0.5, 'sawtooth', 0.12); },
  open()   { [523, 659, 784, 1046, 1318].forEach((f, i) => this.blip(f, 0.25, 'triangle', 0.13, i * 0.07)); },
  win()    { [523, 659, 784, 659, 784, 1046].forEach((f, i) => this.blip(f, 0.24, 'square', 0.06, i * 0.1)); [262, 330, 392].forEach((f, i) => this.blip(f, 0.5, 'triangle', 0.1, 0.4 + i * 0.1)); },
  die()    { this.slide(700, 90, 0.7, 'triangle', 0.2); },
  tick()   { this.blip(1200, 0.04, 'square', 0.05); },
  key()    { this.blip(1320, 0.18, 'sine', 0.14); this.blip(1980, 0.22, 'sine', 0.08, 0.06); },
  gate()   { this.slide(260, 130, 0.25, 'square', 0.08); this.noise(0.2, 700, 0.1); },
  bump()   { this.blip(160, 0.08, 'square', 0.06); },
  magic()  { for (let i = 0; i < 6; i++) this.blip(rnd(1200, 2600), 0.15, 'sine', 0.05, i * 0.04); },
  grow()   { this.slide(180, 320, 0.12, 'sine', 0.05); },
  munch()  { this.slide(260, 120, 0.1, 'square', 0.07); this.slide(240, 110, 0.1, 'square', 0.06, 0.12); },
  slurp()  { this.slide(300, 1100, 0.14, 'sine', 0.13); },
  place()  { this.slide(500, 260, 0.12, 'triangle', 0.12); },
  fuse()   { this.blip(900, 0.03, 'square', 0.04); },
  pickup() { this.slide(400, 900, 0.16, 'triangle', 0.13); },
  appear() { this.slide(300, 1200, 0.35, 'sine', 0.12); },
  ui()     { this.blip(700, 0.07, 'triangle', 0.1); },
  star(n)  { this.blip(660 * Math.pow(1.26, n), 0.3, 'triangle', 0.14); },
  chime()  { [1046, 1318, 1568].forEach((f, i) => this.blip(f, 0.3, 'sine', 0.08, i * 0.05)); }
};

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// a soft, bubbly loop in A minor — 4 bars of 8 steps
const MELODY = [69, 0, 72, 0, 76, 0, 72, 74, 72, 0, 69, 0, 65, 0, 69, 0,
                67, 0, 72, 0, 76, 0, 79, 76, 74, 0, 71, 0, 67, 0, 0, 0];
const ROOTS = [45, 41, 48, 43];
const Music = {
  timer: null, next: 0, step: 0, gain: null, bpm: 100,
  wanted() { return Snd.ac && !save.mute && save.music && !G.silent; },
  start() {
    if (this.timer || !this.wanted()) return;
    if (!this.gain) { this.gain = Snd.ac.createGain(); this.gain.gain.value = 0.5; this.gain.connect(Snd.master); }
    this.next = Snd.ac.currentTime + 0.1;
    this.timer = setInterval(() => this.pump(), 60);
  },
  stop() { if (this.timer) clearInterval(this.timer); this.timer = null; },
  refresh() { if (this.wanted()) this.start(); else this.stop(); },
  pump() {
    if (!this.wanted()) { this.stop(); return; }
    const ac = Snd.ac, spb = 60 / this.bpm / 2;
    if (this.next < ac.currentTime) this.next = ac.currentTime + 0.05;
    while (this.next < ac.currentTime + 0.3) { this.note(this.step, this.next, spb); this.step++; this.next += spb; }
  },
  note(s, t, spb) {
    const pos = s & 7, bar = (s >> 3) & 3, phrase = (s >> 5) & 1;
    if (pos === 0 || pos === 4) this.tone(mtof(ROOTS[bar]), t, spb * 3.6, 'sine', 0.2);
    if (pos === 2 || pos === 6) this.tone(mtof(ROOTS[bar] + 7), t, spb * 1.5, 'sine', 0.07);
    const m = MELODY[s & 31];
    if (m && (phrase === 0 || pos !== 7)) this.tone(mtof(m + (phrase ? 0 : 0)), t, spb * 1.8, 'triangle', 0.06);
    if (phrase === 1 && pos === 3) this.tone(mtof(88 + bar), t, spb * 0.6, 'sine', 0.025);
  },
  tone(f, t, dur, type, vol) {
    const ac = Snd.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + dur + 0.05);
  }
};

const CH = { ' ': T.EMPTY, '.': T.MUD, '=': T.WALL, '#': T.STEEL, 'o': T.ROCK, '*': T.PEARL, 'X': T.EXIT, 'P': T.ENTRY,
  'c': T.CRAB, 'j': T.JELLY, 'a': T.ALGAE, 'm': T.MAGIC, 'f': T.FISH, 'b': T.BOMBITEM, 't': T.CLOCK,
  '1': T.KEY, '2': T.KEY, '3': T.KEY, '7': T.GATE, '8': T.GATE, '9': T.GATE };

/* build the char grid for a level (interior only), then wrap it in steel */
function buildGrid(L, idx) {
  const rows = L.map || [];
  const iw = L.w || Math.max(...rows.map(r => r.length));
  const ih = L.h || rows.length;
  const rand = mulberry32((L.seed || (idx + 1) * 7919) >>> 0);
  const fill = L.fill || { '.': 0.7, 'o': 0.14, '*': 0.08, ' ': 0.08 };
  const fillKeys = Object.keys(fill), fillSum = fillKeys.reduce((a, k) => a + fill[k], 0);
  const randomCh = () => { let r = rand() * fillSum; for (const k of fillKeys) { r -= fill[k]; if (r <= 0) return k; } return '.'; };
  const g = [];
  const isRand = [];
  for (let y = 0; y < ih; y++) {
    g.push([]); isRand.push([]);
    for (let x = 0; x < iw; x++) {
      let ch = (rows[y] && rows[y][x] != null) ? rows[y][x] : (L.pad || '.');
      const r = ch === '?';
      if (r) ch = randomCh();
      g[y].push(ch); isRand[y].push(r);
    }
  }
  const set = (x, y, ch) => { if (x >= 0 && y >= 0 && x < iw && y < ih) { g[y][x] = ch; isRand[y][x] = false; } };
  for (const p of (L.put || [])) {
    if (p[0] === 'row') { for (let k = 0; k < p[4]; k++) set(p[2] + k * p[5], p[3], p[1]); }
    else if (p[0] === 'ring') {
      const [, ch, x, y, w, h] = p;
      for (let yy = y - 1; yy <= y + h; yy++) for (let xx = x - 1; xx <= x + w; xx++) set(xx, yy, '.');
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++)
        if (yy === y || yy === y + h - 1 || xx === x || xx === x + w - 1) set(xx, yy, ch);
    } else {
      const [ch, x, y, w = 1, h = 1] = p;
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) set(xx, yy, ch);
    }
  }
  // keep random rocks off the lotl's head at the start
  for (let y = 0; y < ih; y++) for (let x = 0; x < iw; x++) if (g[y][x] === 'P') {
    for (let yy = y - 2; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++)
      if (yy >= 0 && yy < ih && xx >= 0 && xx < iw && isRand[yy][xx]) g[yy][xx] = '.';
  }
  return { iw, ih, g };
}

/* ============================================================
   GAME STATE
   ============================================================ */
const G = {
  screen: 'title', time: 0, frame: 0, paused: false, silent: false,
  parts: [], floats: [], toast: null, flash: 0, shake: 0,
  dirStack: [], queuedDir: -1, bombQueued: false,
  stick: null, holds: {}, press: null, touchMode: false,
  cavesSel: 0, helpFrom: 'title', newLotl: null, lotlPreview: 0, motes: []
};
let C = null;   // the current cave
let OFF = [0, 0, 0, 0];   // neighbour offsets: up, right, down, left

function newCave(idx) {
  const L = LEVELS[idx];
  const { iw, ih, g } = buildGrid(L, idx);
  const w = iw + 2, h = ih + 2, n = w * h;
  const c = {
    idx, L, w, h, n,
    t: new Uint8Array(n), d: new Int16Array(n), aux: new Int16Array(n), fall: new Uint8Array(n),
    face: new Int8Array(n), roll: new Float32Array(n),
    stamp: new Int32Array(n).fill(-1), from: new Int32Array(n).fill(-1), fromTick: new Int32Array(n).fill(-9),
    born: new Int32Array(n).fill(-99), reveal: new Float32Array(n),
    tick: 0, acc: 0, pearls: 0, need: L.need, time: L.time, timeLeft: L.time, score: 0,
    keys: [0, 0, 0], bombs: 0, hasBombs: false, exitOpen: false,
    magic: { state: 'dormant', t: 0 }, algaeFast: false, algaeOpen: false, algaeCount: 0,
    pending: [], sfx: {}, phase: 'reveal', phaseT: 0, entry: -1, exit: -1,
    player: { i: -1, alive: true, face: 1, lastDir: 1, pushTarget: -1, pushCount: 0, idle: 0, cause: '', lastBump: -1, moveTick: -9 },
    chain: 0, chainT: 0, camX: 0, camY: 0, hintT: 0, hintGone: false, stuck: 0, restartAsk: -9, warned: -1, result: null,
    pearlsSeen: 0
  };
  const rand = mulberry32(idx * 31 + 5);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    c.reveal[i] = rand();
    if (x === 0 || y === 0 || x === w - 1 || y === h - 1) { c.t[i] = T.STEEL; continue; }
    const ch = g[y - 1][x - 1];
    const tt = CH[ch] != null ? CH[ch] : T.MUD;
    c.t[i] = tt;
    if (tt === T.KEY) c.d[i] = +ch - 1;
    if (tt === T.GATE) c.d[i] = +ch - 7;
    if (tt === T.CRAB || tt === T.JELLY) c.d[i] = 3;
    if (tt === T.FISH) { c.d[i] = 1; c.face[i] = 1; }
    if (tt === T.ENTRY) c.entry = i;
    if (tt === T.EXIT) c.exit = i;
    if (tt === T.BOMBITEM) c.hasBombs = true;
    if (tt === T.ROCK) c.roll[i] = rand() * TAU;
  }
  return c;
}

function startCave(idx) {
  C = newCave(idx);
  OFF = [-C.w, 1, C.w, -1];
  G.screen = 'play'; G.paused = false;
  G.parts = []; G.floats = []; G.toast = null; G.flash = 0; G.shake = 0;
  G.queuedDir = -1; G.bombQueued = false;
  snapCamera();
}
// restart mid-cave; when the lotl is boxed in it counts as a try (so SKIP still shows up after 3)
function restartCave() {
  if (C.stuck >= STUCK_STEPS) { save.tries[C.idx] = (save.tries[C.idx] || 0) + 1; persist(); }
  Snd.ui(); startCave(C.idx);
}
// can the lotl go anywhere at all? (dig, grab, step, push, open gate/exit)
function canMove(c) {
  const i = c.player.i, t = c.t;
  for (let dir = 0; dir < 4; dir++) {
    const ti = i + OFF[dir], tt = t[ti];
    if (tt === T.EMPTY || tt === T.MUD || tt === T.PEARL || tt === T.KEY || tt === T.BOMBITEM || tt === T.CLOCK) return true;
    if (tt === T.GATE && c.keys[c.d[ti]]) return true;
    if (tt === T.EXIT && c.exitOpen) return true;
    if (tt === T.ROCK && (dir === 1 || dir === 3) && !c.fall[ti] && t[ti + OFF[dir]] === T.EMPTY) return true;
  }
  return false;
}

/* ============================================================
   CAVE SIMULATION — one step every TICK seconds, scanned top-left
   to bottom-right like the old cave diggers. The lotl moves first so
   a dodge always counts.
   ============================================================ */
function setCell(i, type, d) {
  const c = C;
  c.t[i] = type; c.d[i] = d || 0; c.aux[i] = 0; c.fall[i] = 0;
  c.stamp[i] = c.tick; c.from[i] = -1; c.born[i] = c.tick;
}
function move(a, b) {
  const c = C;
  c.t[b] = c.t[a]; c.d[b] = c.d[a]; c.aux[b] = c.aux[a]; c.fall[b] = c.fall[a];
  c.face[b] = c.face[a]; c.roll[b] = c.roll[a]; c.born[b] = c.born[a];
  c.stamp[b] = c.tick; c.from[b] = a; c.fromTick[b] = c.tick;
  c.t[a] = T.EMPTY; c.d[a] = 0; c.aux[a] = 0; c.fall[a] = 0; c.from[a] = -1;
}
const sfx = name => { if (C) C.sfx[name] = (C.sfx[name] || 0) + 1; };
function flushSfx() {
  const s = C.sfx;
  for (const k in s) {
    if (k === 'pearl') Snd.pearl(C.chain);
    else if (Snd[k]) Snd[k]();
  }
  C.sfx = {};
}

function stepCave() {
  const c = C;
  c.tick++;
  if (c.pending.length) { const list = c.pending; c.pending = []; for (const p of list) explodeAt(p.i, p.pearl); }
  if (c.magic.state === 'active' && --c.magic.t <= 0) c.magic.state = 'spent';
  c.algaeOpen = false; c.algaeCount = 0;
  if (c.phase === 'play' && c.player.alive && c.t[c.player.i] === T.PLAYER) {
    playerUpdate(c.player.i);
    c.stuck = c.t[c.player.i] === T.PLAYER && !canMove(c) ? c.stuck + 1 : 0;
  }
  const w = c.w, t = c.t, tick = c.tick;
  for (let y = 1; y < c.h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    if (c.stamp[i] === tick) continue;
    switch (t[i]) {
      case T.ROCK: case T.PEARL: fallUpdate(i); break;
      case T.CRAB: enemyUpdate(i, T.CRAB); break;
      case T.JELLY: enemyUpdate(i, T.JELLY); break;
      case T.FISH: fishUpdate(i); break;
      case T.ALGAE: algaeUpdate(i); break;
      case T.BOOM: if (++c.d[i] >= 3) setCell(i, c.aux[i]); break;
      case T.BOMB: if (--c.d[i] <= 0) { c.player.cause = 'bomb'; explodeAt(i, false); } else if (c.d[i] <= 4) sfx('fuse'); break;
    }
  }
  if (c.algaeCount > 0) {
    if (!c.algaeOpen) convertAlgae(T.PEARL);
    else if (c.algaeCount >= (c.L.algaeMax || 120)) convertAlgae(T.ROCK);
  }
  if (!c.algaeFast && tick > (c.L.algaeSlow || 220)) c.algaeFast = true;
  flushSfx();
}

function fallUpdate(i) {
  const c = C, t = c.t, b = i + c.w, tb = t[b];
  if (tb === T.EMPTY) { c.fall[i] = 1; move(i, b); return; }
  if (c.fall[i]) {
    if (tb === T.PLAYER) {
      if (t[i] === T.PEARL) { collectPearl(i); setCell(i, T.EMPTY); floatText(b, 'CATCH!', '#fff7c2'); return; }   // pearls land in your arms
      c.player.cause = 'rock'; explodeAt(b, false); return;
    }
    if (tb === T.CRAB || tb === T.BOMB) { explodeAt(b, false); return; }
    if (tb === T.JELLY || tb === T.FISH) { explodeAt(b, true); return; }
    if (tb === T.MAGIC && c.magic.state !== 'spent') { magicPass(i); return; }
  }
  if (ROUND[tb] && !c.fall[b]) {
    if (t[i - 1] === T.EMPTY && t[b - 1] === T.EMPTY) { c.fall[i] = 1; move(i, i - 1); c.roll[i - 1] -= Math.PI / 2; return; }
    if (t[i + 1] === T.EMPTY && t[b + 1] === T.EMPTY) { c.fall[i] = 1; move(i, i + 1); c.roll[i + 1] += Math.PI / 2; return; }
  }
  if (c.fall[i]) {
    c.fall[i] = 0;
    if (t[i] === T.ROCK) { sfx('land'); G.shake = Math.max(G.shake, 2.5); dust(i); }
    else sfx('clink');
  }
}

function magicPass(i) {
  const c = C, m = i + c.w, out = m + c.w;
  if (c.magic.state === 'dormant') {
    c.magic.state = 'active'; c.magic.t = c.L.magicTime || MAGIC_TICKS;
    showToast('The coral is glowing!', '#8ff7ff');
  }
  const nt = c.t[i] === T.ROCK ? T.PEARL : T.ROCK;
  setCell(i, T.EMPTY);
  if (c.t[out] === T.EMPTY) { setCell(out, nt); c.fall[out] = 1; c.from[out] = i; c.fromTick[out] = c.tick; }
  sparkle(m, 8, '#bffcff');
  sfx('magic');
}

function enemyUpdate(i, kind) {
  const c = C, t = c.t;
  for (let k = 0; k < 4; k++) {
    const n = t[i + OFF[k]];
    if (n === T.PLAYER || n === T.ALGAE) {
      if (n === T.PLAYER) c.player.cause = kind === T.CRAB ? 'crab' : 'jelly';
      explodeAt(i, kind === T.JELLY);
      return;
    }
  }
  if (c.tick % CRITTER_EVERY) return;   // touching is checked every step, walking only every few
  // crabs hug the wall on their left, jellies on their right
  const d = c.d[i], turn = kind === T.CRAB ? 3 : 1;
  const pref = (d + turn) & 3;
  if (t[i + OFF[pref]] === T.EMPTY) { c.d[i] = pref; setFace(i, pref); move(i, i + OFF[pref]); return; }
  if (t[i + OFF[d]] === T.EMPTY) { setFace(i, d); move(i, i + OFF[d]); return; }
  c.d[i] = (d + 4 - turn) & 3;
}
const setFace = (i, dir) => { if (dir === 1) C.face[i] = 1; else if (dir === 3) C.face[i] = -1; };

/* the catfish: a rival pearl collector. Swims only in open water. */
const bfsPrev = { arr: null, q: null };
function fishUpdate(i) {
  const c = C, t = c.t;
  if (c.tick % CRITTER_EVERY) return;   // same pace as crabs and jellies
  for (let k = 0; k < 4; k++) {
    const n = i + OFF[k];
    if (t[n] === T.PEARL && !c.fall[n]) {
      const eaten = c.aux[i] + 1;
      setCell(n, T.EMPTY); setFace(i, k); move(i, n); c.aux[n] = eaten; c.d[n] = k;
      sfx('munch'); floatText(n, 'MUNCH', '#ffcf8a');
      return;
    }
  }
  let dir = fishPath(i);
  if (dir < 0) {
    const d = c.d[i];
    if (t[i + OFF[d]] === T.EMPTY && Math.random() < 0.75) dir = d;
    else {
      const opts = [0, 1, 2, 3].filter(k => t[i + OFF[k]] === T.EMPTY);
      dir = opts.length ? pick(opts) : -1;
    }
  }
  if (dir >= 0 && t[i + OFF[dir]] === T.EMPTY) { c.d[i] = dir; setFace(i, dir); move(i, i + OFF[dir]); }
}
function fishPath(start) {
  const c = C, t = c.t, n = c.n;
  if (!bfsPrev.arr || bfsPrev.arr.length !== n) { bfsPrev.arr = new Int32Array(n); bfsPrev.q = new Int32Array(n); }
  const prev = bfsPrev.arr, q = bfsPrev.q;
  prev.fill(-2);
  let qh = 0, qt = 0;
  q[qt++] = start; prev[start] = -1;
  let found = -1, seen = 0;
  while (qh < qt && seen < 260) {
    const cur = q[qh++]; seen++;
    for (let k = 0; k < 4; k++) {
      const nb = cur + OFF[k];
      if (t[nb] === T.PEARL && !c.fall[nb] && cur !== start) { found = cur; break; }
      if (t[nb] === T.EMPTY && prev[nb] === -2) { prev[nb] = cur; q[qt++] = nb; }
    }
    if (found >= 0) break;
  }
  if (found < 0) return -1;
  let cur = found;
  while (prev[cur] !== start && prev[cur] >= 0) cur = prev[cur];
  for (let k = 0; k < 4; k++) if (start + OFF[k] === cur) return k;
  return -1;
}

function algaeUpdate(i) {
  const c = C, t = c.t;
  c.algaeCount++;
  let open = false;
  for (let k = 0; k < 4; k++) { const n = t[i + OFF[k]]; if (n === T.EMPTY || n === T.MUD) { open = true; break; } }
  if (!open) return;
  c.algaeOpen = true;
  if (Math.random() < (c.algaeFast ? 0.11 : 0.025)) {
    const n = i + OFF[(Math.random() * 4) | 0];
    if (t[n] === T.EMPTY || t[n] === T.MUD) { setCell(n, T.ALGAE); if (Math.random() < 0.3) sfx('grow'); }
  }
}
function convertAlgae(type) {
  const c = C;
  let n = 0;
  for (let i = 0; i < c.n; i++) if (c.t[i] === T.ALGAE) { setCell(i, type); n++; if (n % 3 === 0) sparkle(i, 2, type === T.PEARL ? '#fff' : '#cfd6dc'); }
  if (type === T.PEARL) { showToast('The algae turned into pearls!', '#c7ffb0'); Snd.chime(); G.flash = 0.4; }
  else { showToast('Too much algae! It turned to rock!', '#ffd0a0'); Snd.land(); G.shake = 8; }
}

function explodeAt(ci, pearl) {
  const c = C, w = c.w, t = c.t;
  const res = pearl ? T.PEARL : T.EMPTY;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const n = ci + dx + dy * w, tn = t[n];
    if (UNBREAKABLE[tn]) continue;
    if (n !== ci) {
      if (tn === T.CRAB || tn === T.BOMB) c.pending.push({ i: n, pearl: false });
      else if (tn === T.JELLY || tn === T.FISH) c.pending.push({ i: n, pearl: true });
    }
    if (tn === T.FISH) {
      const got = c.aux[n];
      if (got > 0) { c.pearls += got; c.score += got * 10; floatText(n, '+' + got + ' pearls back!', '#fff7c2'); checkExit(); }
      c.score += 50;
    }
    if (tn === T.CRAB) c.score += 25;
    if (tn === T.JELLY) c.score += 50;
    if (tn === T.PLAYER) killPlayer(c.player.cause || 'boom');
    setCell(n, T.BOOM); c.aux[n] = res;
  }
  const [px, py] = cellCenter(ci);
  for (let k = 0; k < 26; k++) {
    const a = rnd(0, TAU), s = rnd(60, 260);
    G.parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.4, 0.9), max: 0.9, size: rnd(4, 11),
      color: pearl ? pick(['#ffffff', '#ffd6f5', '#d9c8ff']) : pick(['#ffffff', '#cdeffd', '#9fd8ee']), grav: -60, kind: 'bubble' });
  }
  G.shake = Math.max(G.shake, 9);
  sfx('boom');
}

function killPlayer(cause) {
  const c = C, P = c.player;
  if (!P.alive) return;
  P.alive = false; P.cause = cause;
  c.phase = 'dead'; c.phaseT = 0;
  save.tries[c.idx] = (save.tries[c.idx] || 0) + 1; persist();
  Snd.die();
}

function takeDir() {
  if (G.queuedDir >= 0) { const d = G.queuedDir; G.queuedDir = -1; return d; }
  if (G.stick && G.stick.dir >= 0) return G.stick.dir;
  if (G.dirStack.length) return G.dirStack[G.dirStack.length - 1];
  return -1;
}
const grabHeld = () => keysDown.has('Space') || keysDown.has('ShiftLeft') || keysDown.has('ShiftRight') || Object.values(G.holds).includes('grab');

function playerUpdate(i) {
  const c = C, P = c.player, t = c.t;
  c.stamp[i] = c.tick;
  if (G.bombQueued) {
    G.bombQueued = false;
    if (c.bombs > 0) {
      const ti = i + OFF[P.lastDir];
      if (t[ti] === T.EMPTY || t[ti] === T.MUD) { setCell(ti, T.BOMB, BOMB_FUSE); c.bombs--; sfx('place'); }
      else { floatText(i, 'No room!', '#ffd0d0'); sfx('bump'); }
    } else { floatText(i, 'No puffers!', '#ffd0d0'); }
  }
  const dir = takeDir();
  if (dir < 0) { P.pushTarget = -1; P.idle++; return; }
  P.idle = 0; P.lastDir = dir;
  if (dir === 1) P.face = 1; else if (dir === 3) P.face = -1;
  const ti = i + OFF[dir], tt = t[ti];
  const grab = grabHeld();
  let ok = false;
  switch (tt) {
    case T.EMPTY: ok = !grab; break;
    case T.MUD: ok = true; digFx(ti, dir); sfx('dig'); break;
    case T.PEARL: ok = true; collectPearl(ti); break;
    case T.KEY: ok = true; c.keys[c.d[ti]] = 1; sfx('key'); showToast('Got the ' + KEY_NAMES[c.d[ti]] + ' key!', KEY_COLORS[c.d[ti]]); sparkle(ti, 10, KEY_COLORS[c.d[ti]]); break;
    case T.BOMBITEM: ok = true; c.bombs++; sfx('pickup'); floatText(ti, '+1 puffer', '#ffe27a'); break;
    case T.CLOCK: ok = true; c.timeLeft += 15; sfx('chime'); floatText(ti, '+15 sec', '#bff6ff'); sparkle(ti, 10, '#bff6ff'); break;
    case T.GATE:
      if (c.keys[c.d[ti]]) { ok = true; sfx('gate'); sparkle(ti, 12, KEY_COLORS[c.d[ti]]); }
      else { if (P.lastBump !== ti) { floatText(ti, 'Need the ' + KEY_NAMES[c.d[ti]] + ' key!', '#ffe0e0'); sfx('bump'); } P.lastBump = ti; }
      break;
    case T.EXIT:
      if (c.exitOpen && !grab) { setCell(i, T.EMPTY); winCave(); return; }
      if (!c.exitOpen && P.lastBump !== ti) { floatText(ti, (c.need - c.pearls) + ' more pearls!', '#ffe0e0'); sfx('bump'); P.lastBump = ti; }
      break;
    case T.ROCK:
      if ((dir === 1 || dir === 3) && !c.fall[ti] && !grab) {
        const b = ti + OFF[dir];
        if (t[b] === T.EMPTY) {
          if (P.pushTarget === ti) P.pushCount++; else { P.pushTarget = ti; P.pushCount = 1; }
          if (P.pushCount >= PUSH_TICKS) {
            move(ti, b); c.roll[b] += dir === 1 ? Math.PI / 2 : -Math.PI / 2;
            P.pushTarget = -1; sfx('push');
            move(i, ti); P.i = ti; P.moveTick = c.tick;
          }
          return;
        }
      }
      break;
  }
  P.pushTarget = -1;
  if (tt !== T.GATE && tt !== T.EXIT) P.lastBump = -1;
  if (!ok) return;
  if (grab) {
    if (tt !== T.EMPTY) { setCell(ti, T.EMPTY); sfx('slurp'); P.slurp = { at: G.time, dir }; }
    return;
  }
  move(i, ti); P.i = ti; P.moveTick = c.tick;
}

function collectPearl(i) {
  const c = C;
  c.pearls++;
  c.chain = c.chainT > 0 ? c.chain + 1 : 0;
  c.chainT = 1.6;
  c.score += c.pearls > c.need ? 20 : 10;
  sfx('pearl');
  sparkle(i, 9, '#fff6d8');
  checkExit();
}
function checkExit() {
  const c = C;
  if (!c.exitOpen && c.pearls >= c.need) {
    c.exitOpen = true; G.flash = 0.6;
    Snd.open();
    showToast('The shell is open! Swim in!', '#ffe27a');
  }
}

function winCave() {
  const c = C, idx = c.idx;
  c.phase = 'won'; c.phaseT = 0; c.acc = TICK * 0.999;
  const timeBonus = Math.ceil(c.timeLeft) * 5;
  const total = c.score + timeBonus;
  const starPearls = Math.ceil(c.need * 1.4);
  let stars = 1;
  if (c.pearls >= starPearls) stars++;
  if (c.timeLeft >= c.time * 0.35) stars++;
  const before = LOTLS.filter(isUnlocked).map(l => l.id);
  save.pearlsAll += c.pearls;
  save.best[idx] = Math.max(save.best[idx] || 0, total);
  save.stars[idx] = Math.max(save.stars[idx] || 0, stars);
  save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, idx + 2));
  if (idx === LEVELS.length - 1) save.champion = true;
  const fresh = LOTLS.filter(l => isUnlocked(l) && !before.includes(l.id));
  persist();
  c.result = { timeBonus, total, stars, starPearls, fresh, shown: 0 };
  Snd.win();
  confetti();
}

/* ============================================================
   PARTICLES + FLOATING TEXT

function cellCenter(i) { return [(i % C.w) * TS + TS / 2, ((i / C.w) | 0) * TS + TS / 2]; }
function sparkle(i, n, color) {

}

function dust(i) {

}

      size: rnd(5, 10), color: pick(['#ff7aa8', '#ffe27a', '#8ff7ff', '#b8ff8a', '#ffffff', '#c9a6ff']), grav: 60, kind: 'confetti', spin: rnd(0, TAU) });
}

/* ============================================================
   INPUT — keyboard, touch joystick, buttons
   ============================================================ */
const keysDown = new Set();
const KEYDIR = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
let buttons = [];
let kbFocus = 0;

window.addEventListener('keydown', e => {
  Snd.boot();
  const code = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(code)) e.preventDefault();
  const fresh = !keysDown.has(code);
  keysDown.add(code);
  if (G.screen === 'play' && C) {
    const overlay = playOverlay();
    if (!overlay) {
      if (KEYDIR[code] != null) {
        const d = KEYDIR[code];
        if (fresh) { G.dirStack = G.dirStack.filter(x => x !== d); G.dirStack.push(d); if (C.phase === 'play') G.queuedDir = d; }
        dismissHint();
        return;
      }
      if (fresh && (code === 'KeyB' || code === 'KeyX' || code === 'Enter')) { G.bombQueued = true; return; }
      if (fresh && (code === 'Escape' || code === 'KeyP')) { G.paused = true; kbFocus = 0; Snd.ui(); return; }
      if (fresh && code === 'KeyR' && C.phase === 'play') { restartCave(); return; }
      return;
    }
  }
  if (!fresh) return;
  menuKey(code);
});
window.addEventListener('keyup', e => {
  keysDown.delete(e.code);
  const d = KEYDIR[e.code];
  if (d != null) G.dirStack = G.dirStack.filter(x => x !== d);
});
window.addEventListener('blur', () => { keysDown.clear(); G.dirStack = []; G.holds = {}; G.stick = null; });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.screen === 'play' && C && C.phase === 'play') G.paused = true; });

// keyboard on menus: arrows move focus between buttons, Enter presses, Esc backs out
function menuKey(code) {
  const navs = buttons.filter(b => b.nav !== false && b.act && !b.hold);
  if (code === 'Escape') { const back = buttons.find(b => b.back); if (back) { Snd.ui(); back.act(); } return; }
  if (G.screen === 'title') {
    if (code === 'ArrowLeft') { cycleLotl(-1); return; }
    if (code === 'ArrowRight') { cycleLotl(1); return; }
    if (code === 'KeyH' || code === 'Slash') { openHelp(); return; }
    if (code === 'KeyC' || code === 'KeyL') { openCaves(); return; }
  }
  if (G.screen === 'caves') {
    const n = LEVELS.length;
    if (code === 'ArrowRight') { G.cavesSel = (G.cavesSel + 1) % n; Snd.ui(); return; }
    if (code === 'ArrowLeft') { G.cavesSel = (G.cavesSel + n - 1) % n; Snd.ui(); return; }
    if (code === 'ArrowDown') { G.cavesSel = Math.min(n - 1, G.cavesSel + 4); Snd.ui(); return; }
    if (code === 'ArrowUp') { G.cavesSel = Math.max(0, G.cavesSel - 4); Snd.ui(); return; }
    if (code === 'Enter' || code === 'Space') { if (G.cavesSel < save.unlocked) { Snd.ui(); startCave(G.cavesSel); } return; }
    return;
  }
  if (!navs.length) return;
  if (code === 'ArrowDown' || code === 'ArrowRight' || code === 'Tab' || code === 'KeyS' || code === 'KeyD') { kbFocus = (kbFocus + 1) % navs.length; Snd.ui(); }
  else if (code === 'ArrowUp' || code === 'ArrowLeft' || code === 'KeyW' || code === 'KeyA') { kbFocus = (kbFocus + navs.length - 1) % navs.length; Snd.ui(); }
  else if (code === 'Enter' || code === 'Space') { const b = navs[kbFocus % navs.length]; if (b) { Snd.ui(); b.act(); } }
  else if (code === 'KeyR' && G.screen === 'play') { const r = buttons.find(b => b.id === 'retry'); if (r) r.act(); }
}

function hitButton(x, y) {
  for (let k = buttons.length - 1; k >= 0; k--) {
    const b = buttons[k];
    if (b.r ? (x - b.x) ** 2 + (y - b.y) ** 2 <= b.r * b.r : (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h)) return b;
  }
  return null;
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  Snd.boot();
  cvs.focus();
  if (e.pointerType === 'touch' || e.pointerType === 'pen') G.touchMode = true;
  const p = toWorld(e.clientX, e.clientY);
  const b = hitButton(p.x, p.y);
  if (b) {
    if (b.hold) { G.holds[e.pointerId] = b.id; if (b.act) b.act(); }
    else G.press = { id: b.id, pid: e.pointerId };
    return;
  }
  if (G.screen === 'play' && C && !playOverlay()) {
    dismissHint();
    if (!G.stick) G.stick = { pid: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y, dir: -1 };
  }
});
cvs.addEventListener('pointermove', e => {
  const s = G.stick;
  if (!s || s.pid !== e.pointerId) return;
  const p = toWorld(e.clientX, e.clientY);
  s.x = p.x; s.y = p.y;
  let dx = s.x - s.ox, dy = s.y - s.oy;
  const dist = Math.hypot(dx, dy);
  const MAXR = 70;
  if (dist > MAXR) { s.ox = s.x - dx / dist * MAXR; s.oy = s.y - dy / dist * MAXR; dx = s.x - s.ox; dy = s.y - s.oy; }
  let dir = -1;
  if (dist > 18) dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  if (dir >= 0 && dir !== s.dir && C && C.phase === 'play') G.queuedDir = dir;
  s.dir = dir;
});
function pointerEnd(e) {
  if (G.stick && G.stick.pid === e.pointerId) G.stick = null;
  if (G.holds[e.pointerId]) delete G.holds[e.pointerId];
  if (G.press && G.press.pid === e.pointerId) {
    const p = toWorld(e.clientX, e.clientY);
    const b = hitButton(p.x, p.y);
    const id = G.press.id;
    G.press = null;
    if (b && b.id === id && b.act && e.type === 'pointerup') { Snd.ui(); b.act(); }
  }
}
cvs.addEventListener('pointerup', pointerEnd);
cvs.addEventListener('pointercancel', pointerEnd);
cvs.addEventListener('contextmenu', e => e.preventDefault());

/* ============================================================
   SCREEN FLOW
   ============================================================ */
function playOverlay() {
  if (!C) return null;
  if (G.paused) return 'paused';
  if (C.phase === 'won' && C.phaseT > 0.9) return 'won';
  if (C.phase === 'dead' && C.phaseT > 1.5) return 'dead';
  if (C.phase === 'timeup' && C.phaseT > 0.7) return 'timeup';
  return null;
}
function dismissHint() { if (C && C.phase === 'play' && C.hintT > 0.6) C.hintGone = true; }
function goTitle() { G.screen = 'title'; G.paused = false; kbFocus = 0; C = null; }
function openCaves() { G.screen = 'caves'; G.paused = false; G.cavesSel = Math.min(save.unlocked - 1, LEVELS.length - 1); C = null; kbFocus = 0; Snd.ui(); }
function openHelp() { G.helpFrom = G.screen === 'play' ? 'play' : G.screen; G.screen = 'help'; kbFocus = 0; Snd.ui(); }
function closeHelp() { G.screen = G.helpFrom === 'play' && C ? 'play' : (G.helpFrom === 'caves' ? 'caves' : 'title'); kbFocus = 0; }
function nextCaveIndex() {
  for (let i = 0; i < LEVELS.length; i++) if (save.best[i] == null && i < save.unlocked) return i;
  return Math.min(save.unlocked, LEVELS.length) - 1;
}
function cycleLotl(dir) {
  const n = LOTLS.length;
  let k = save.lotl;
  for (let s = 0; s < n; s++) { k = (k + dir + n) % n; if (isUnlocked(LOTLS[k])) break; }
  save.lotl = k; persist(); Snd.ui();
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt) {
  if (G.freeze) return;   // debug: LotlDash.G.freeze = true holds the frame for screenshots
  G.time += dt; G.frame++;
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.4);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);
  if (G.toast) { G.toast.t += dt; if (G.toast.t > 2.6) G.toast = null; }
  for (const p of G.parts) { p.life -= dt; p.vy += (p.grav || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= (1 - dt * 1.5); if (p.spin != null) p.spin += dt * 6; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const f of G.floats) { f.life -= dt; f.y -= 36 * dt; }
  G.floats = G.floats.filter(f => f.life > 0);
  if (G.screen === 'play' && C) updatePlay(dt);
}

function updatePlay(dt) {
  const c = C;
  if (G.paused) return;
  c.phaseT += dt;
  if (c.chainT > 0) c.chainT -= dt;
  if (c.phase === 'reveal' && c.phaseT >= REVEAL_TIME) { c.phase = 'entry'; c.phaseT = 0; }
  if (c.phase === 'entry' && c.phaseT >= 0.8) {
    c.phase = 'play'; c.phaseT = 0;
    setCell(c.entry, T.PLAYER); c.player.i = c.entry;
    Snd.appear(); sparkle(c.entry, 14, '#ffd6e6');
    G.queuedDir = -1;
  }
  if (c.phase === 'play') {
    c.hintT += dt;
    const before = Math.ceil(c.timeLeft);
    c.timeLeft -= dt;
    const now = Math.ceil(c.timeLeft);
    if (now !== before && now <= 10 && now > 0) Snd.tick();
    if (c.timeLeft <= 0) {
      c.timeLeft = 0; c.phase = 'timeup'; c.phaseT = 0; c.player.cause = 'time';
      save.tries[c.idx] = (save.tries[c.idx] || 0) + 1; persist();
      Snd.die();
    }
  }
  if (c.phase === 'entry' || c.phase === 'play' || c.phase === 'dead' || c.phase === 'timeup') {
    c.acc += dt;
    let guard = 0;
    while (c.acc >= TICK && guard++ < 4) { c.acc -= TICK; stepCave(); if (c.phase === 'won') break; }
    if (c.acc > TICK) c.acc = TICK * 0.99;
  }
  updateCamera(dt);
}

function playerPixel() {
  const c = C;
  if (c.player.i >= 0 && c.t[c.player.i] === T.PLAYER) return objPos(c.player.i, frac());
  const i = c.player.i >= 0 ? c.player.i : c.entry;
  return cellCenter(i);
}
const frac = () => C.phase === 'won' ? 1 : clamp(C.acc / TICK, 0, 1);
function camTarget() {
  const c = C, vw = W, vh = H - HUD_H, cw = c.w * TS, chh = c.h * TS;
  const [px, py] = playerPixel();
  const tx = cw <= vw ? (cw - vw) / 2 : clamp(px - vw / 2, 0, cw - vw);
  const ty = chh <= vh ? (chh - vh) / 2 : clamp(py - vh / 2, 0, chh - vh);
  return [tx, ty];
}
function snapCamera() { const [tx, ty] = camTarget(); C.camX = tx; C.camY = ty; }
function updateCamera(dt) {
  const [tx, ty] = camTarget();
  const k = Math.min(1, dt * 6);
  C.camX += (tx - C.camX) * k; C.camY += (ty - C.camY) * k;
}
function objPos(i, f) {
  const c = C, x = i % c.w, y = (i / c.w) | 0;
  const tt = c.t[i], span = tt === T.CRAB || tt === T.JELLY || tt === T.FISH ? CRITTER_EVERY : 1;
  const age = c.tick - c.fromTick[i];
  if (c.from[i] >= 0 && age >= 0 && age < span) {
    f = (age + f) / span;   // slow critters glide across the whole gap between their steps
    const a = c.from[i], ax = a % c.w, ay = (a / c.w) | 0;
    return [(ax + (x - ax) * f) * TS + TS / 2, (ay + (y - ay) * f) * TS + TS / 2];
  }
  return [x * TS + TS / 2, y * TS + TS / 2];
}

/* ============================================================
   SPRITES — static tiles are pre-drawn at device resolution
   ============================================================ */
const SPR = {};
function makeSprite(fn) {
  const S = Math.max(16, Math.round(TS * scale * DPR));
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'); g.scale(S / TS, S / TS);
  fn(g);
  return cv;
}
function ensureSprites(world) {
  const key = world + ':' + Math.round(TS * scale * DPR);
  if (spritesFor === key) return;
  spritesFor = key;
  const p = WORLDS[world];
  SPR.mud = [0, 1, 2, 3].map(v => makeSprite(g => drawMudTile(g, p, v)));
  SPR.wall = makeSprite(g => drawWallTile(g, p));
  SPR.steel = makeSprite(g => drawSteelTile(g, p));
  SPR.rock = makeSprite(g => drawRockTile(g, p));
  SPR.pearl = makeSprite(g => drawPearlTile(g));
}
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawMudTile(g, p, v) {
  g.fillStyle = p.mud; g.fillRect(0, 0, TS, TS);
  const r = mulberry32(v * 977 + 13);
  for (let k = 0; k < 11; k++) {
    g.globalAlpha = 0.35 + r() * 0.4;
    g.fillStyle = r() < 0.55 ? p.mudDark : p.mudLight;
    g.beginPath(); g.ellipse(4 + r() * (TS - 8), 4 + r() * (TS - 8), 2 + r() * 4, 1.5 + r() * 2.5, r() * 3, 0, TAU); g.fill();
  }
  g.globalAlpha = 0.5; g.fillStyle = p.mudLight;
  for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(6 + r() * (TS - 12), 6 + r() * (TS - 12), 1.4, 0, TAU); g.fill(); }
  g.globalAlpha = 1;
}
function drawWallTile(g, p) {
  g.fillStyle = p.mortar; g.fillRect(0, 0, TS, TS);
  const bh = TS / 2;
  for (let row = 0; row < 2; row++) {
    const off = row ? -TS / 4 : 0;
    for (let k = -1; k < 3; k++) {

    }
  }
}
function drawSteelTile(g, p) {

  g.fillStyle = p.steelHi; g.fillRect(0, 0, TS, 4); g.fillRect(0, 0, 4, TS);

}
function drawRockTile(g, p) {

/* ============================================================
   DRAWING — creatures and things that move
   ============================================================ */
const INK = '#20141f';
function wobbleCircle(x, y, r, seed) {
  ctx.beginPath();
  for (let i = 0; i <= 18; i++) {
    const a = (i / 18) * TAU, w = 1 + Math.sin(a * 3 + seed) * 0.035 + Math.sin(a * 5 - seed) * 0.025;
    const px = x + Math.cos(a) * r * w, py = y + Math.sin(a) * r * w;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

// the lotl, straight from Lotl Quest (minus the trident)
function drawLotl(x, y, r, c, o) {
  o = o || {};
  const t = o.t || 0, flip = o.flip ? -1 : 1;
  ctx.save();
  ctx.translate(x, y); ctx.scale(flip, 1);
  if (o.tilt) ctx.rotate(o.tilt);
  if (o.squash) ctx.scale(1 + o.squash, 1 - o.squash);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const wag = Math.sin(t * 0.12) * 0.35;
  ctx.save(); ctx.rotate(wag * 0.25);
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(-r * 0.5, -r * 0.15);
  ctx.quadraticCurveTo(-r * 1.7, -r * 0.9, -r * 2.05, -r * 0.1);
  ctx.quadraticCurveTo(-r * 1.7, r * 0.85, -r * 0.5, r * 0.25);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = r * 0.09; ctx.stroke();
  ctx.restore();
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const base = side * (Math.PI / 2) + (i - 1) * 0.46 * side;
      const wig = Math.sin(t * 0.11 + i * 1.3 + (side > 0 ? 1 : 0)) * 0.12;
      const bx = Math.cos(base) * r * 0.7, by = Math.sin(base) * r * 0.7;
      const len = r * (0.9 - Math.abs(i - 1) * 0.12);
      ctx.save(); ctx.translate(bx, by); ctx.rotate(base + wig);
      ctx.strokeStyle = c.gill; ctx.lineWidth = r * 0.14;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.55, len * 0.22, len, 0); ctx.stroke();
      ctx.fillStyle = c.gill; ctx.beginPath(); ctx.arc(len, 0, r * 0.16, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  ctx.strokeStyle = INK; ctx.lineWidth = r * 0.11;
  const step = o.walk || 0;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(-r * 0.1, s * r * 0.55);
    ctx.lineTo(-r * 0.35 + Math.sin(step + s) * r * 0.2, s * r * 0.95 + Math.sin(t * 0.1 + s) * 2);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.35, s * r * 0.6);
    ctx.lineTo(r * 0.55 - Math.sin(step + s) * r * 0.2, s * r * 0.98);
    ctx.stroke();
  }
  ctx.fillStyle = c.body; wobbleCircle(0, 0, r, o.seed || 1); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = r * 0.1; ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,160,0.35)';
  ctx.beginPath(); ctx.ellipse(r * 0.15, r * 0.3, r * 0.22, r * 0.14, 0, 0, TAU); ctx.fill();
  const eyeInk = c.eye || INK;
  const blink = o.blink;
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(r * 0.32, s * r * 0.3);
    const ew = r * 0.24, eh = blink ? r * 0.05 : r * 0.2;
    ctx.fillStyle = eyeInk;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-ew / 2, -eh / 2, ew, eh, r * 0.05) : ctx.rect(-ew / 2, -eh / 2, ew, eh); ctx.fill();
    if (!blink) { ctx.fillStyle = c.eye ? INK : '#fff'; ctx.beginPath(); ctx.arc(ew * 0.18, -eh * 0.18, r * 0.05, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  ctx.strokeStyle = eyeInk; ctx.lineWidth = r * 0.07;
  if (o.mouth === 'o') { ctx.fillStyle = '#7a1f3a'; ctx.beginPath(); ctx.arc(r * 0.62, 0, r * 0.14, 0, TAU); ctx.fill(); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(r * 0.5, 0, r * 0.24, -0.7, 0.7); ctx.stroke(); }
  if (o.tongue) {
    ctx.strokeStyle = '#ff7aa0'; ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.moveTo(r * 0.7, 0); ctx.lineTo(r * 0.7 + o.tongue, 0); ctx.stroke();
    ctx.fillStyle = '#ff7aa0'; ctx.beginPath(); ctx.arc(r * 0.7 + o.tongue, 0, r * 0.16, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawPlayer(cx, cy) {
  const c = C, P = c.player, lotl = LOTLS[save.lotl] || LOTLS[0];
  const moving = c.tick - P.moveTick <= 1;
  const bob = moving ? 0 : Math.sin(G.time * 3) * 1.5;
  let tilt = 0;
  if (P.lastDir === 0) tilt = -0.55; else if (P.lastDir === 2) tilt = 0.55;
  let tongue = 0, tdir = P.lastDir;
  if (P.slurp && G.time - P.slurp.at < 0.25) {
    const k = (G.time - P.slurp.at) / 0.25;
    tongue = Math.sin(k * Math.PI) * TS * 0.75; tdir = P.slurp.dir;
    if (tdir === 0) tilt = -1.2; else if (tdir === 2) tilt = 1.2;
  }
  const flip = tdir === 1 ? false : tdir === 3 ? true : P.face < 0;
  const blink = (G.time % 3.7) < 0.12;
  drawLotl(cx, cy + bob, TS * 0.3, lotl, { t: G.frame, flip, tilt, walk: moving ? G.time * 18 : 0, blink, tongue, mouth: P.idle > 60 ? 'o' : null });
  if (P.idle > 20 && Math.random() < 0.02) G.parts.push({ x: cx + (P.face > 0 ? 10 : -10), y: cy - 14, vx: rnd(-8, 8), vy: -40, life: 1.4, max: 1.4, size: rnd(3, 5), color: 'rgba(220,250,255,0.8)', grav: -10, kind: 'bubble' });
}

function drawCrab(cx, cy, i, scl) {
  const s = TS * (scl || 1), t = G.time * 8 + i;
  ctx.save(); ctx.translate(cx, cy + Math.sin(t) * 1.2);
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#8a2414'; ctx.lineWidth = s * 0.06;
  for (const side of [-1, 1]) for (let k = 0; k < 3; k++) {
    const kick = Math.sin(t + k * 1.6 + side) * s * 0.04;
    ctx.beginPath(); ctx.moveTo(side * s * 0.15, s * 0.04 + k * s * 0.05);
    ctx.quadraticCurveTo(side * s * 0.36, s * 0.02 + k * s * 0.07, side * s * 0.42, s * 0.24 + k * s * 0.03 + kick); ctx.stroke();
  }
  const snap = (Math.sin(t * 0.7) + 1) * 0.5;
  for (const side of [-1, 1]) {
    ctx.strokeStyle = '#8a2414'; ctx.lineWidth = s * 0.07;
    ctx.beginPath(); ctx.moveTo(side * s * 0.2, -s * 0.02); ctx.quadraticCurveTo(side * s * 0.36, -s * 0.12, side * s * 0.33, -s * 0.24); ctx.stroke();
    ctx.save(); ctx.translate(side * s * 0.33, -s * 0.28);
    ctx.fillStyle = '#ff5a33'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.11, Math.PI * 0.15 + snap * 0.3, Math.PI * 1.85 - snap * 0.3); ctx.lineTo(0, 0); ctx.closePath();
    ctx.rotate(side * -0.4 - Math.PI / 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#ff6a3d'; ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.ellipse(0, s * 0.05, s * 0.27, s * 0.19, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.ellipse(-s * 0.08, -s * 0.03, s * 0.12, s * 0.05, -0.3, 0, TAU); ctx.fill();
  for (const side of [-1, 1]) {
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(side * s * 0.08, -s * 0.08); ctx.lineTo(side * s * 0.1, -s * 0.2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(side * s * 0.1, -s * 0.22, s * 0.065, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(side * s * 0.1 + s * 0.015, -s * 0.22, s * 0.03, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, s * 0.06, s * 0.07, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.restore();
}

function drawJelly(cx, cy, i, scl) {
  const s = TS * (scl || 1), t = G.time * 3 + i * 0.7;
  const pulse = Math.sin(t * 2) * 0.06;
  ctx.save(); ctx.translate(cx, cy - s * 0.06 + Math.sin(t) * 2);
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(214,150,255,0.85)'; ctx.lineWidth = s * 0.05;
  for (let k = -2; k <= 2; k++) {
    ctx.beginPath(); ctx.moveTo(k * s * 0.07, s * 0.02);
    for (let j = 1; j <= 4; j++) ctx.lineTo(k * s * 0.07 + Math.sin(t * 3 + j + k) * s * 0.04, s * 0.02 + j * s * 0.09);
    ctx.stroke();
  }
  const g = ctx.createRadialGradient(-s * 0.08, -s * 0.12, s * 0.02, 0, -s * 0.02, s * 0.34);
  g.addColorStop(0, '#f6dcff'); g.addColorStop(0.6, '#c07cf2'); g.addColorStop(1, '#8a48d6');
  ctx.fillStyle = g; ctx.strokeStyle = '#4a1f73'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.ellipse(0, 0, s * (0.32 + pulse), s * (0.28 - pulse), 0, Math.PI, 0);
  for (let k = 4; k >= 0; k--) ctx.quadraticCurveTo(-s * 0.32 + (k + 0.5) * s * 0.128, s * 0.1, -s * 0.32 + k * s * 0.128, s * 0.04);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(-s * 0.1, -s * 0.06, s * 0.04, 0, TAU); ctx.arc(s * 0.1, -s * 0.06, s * 0.04, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,200,0.5)';
  ctx.beginPath(); ctx.arc(-s * 0.17, 0, s * 0.04, 0, TAU); ctx.arc(s * 0.17, 0, s * 0.04, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(0, -s * 0.02, s * 0.05, 0.3, Math.PI - 0.3); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-s * 0.12, -s * 0.17, s * 0.07, s * 0.035, -0.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawFish(cx, cy, i, face, eaten, scl) {
  const s = TS * (scl || 1), t = G.time * 5 + i;
  const fat = Math.min(0.12, (eaten || 0) * 0.012);
  ctx.save(); ctx.translate(cx, cy + Math.sin(t * 0.6) * 2); ctx.scale(face < 0 ? -1 : 1, 1);
  ctx.fillStyle = '#7d6b5a'; ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
  ctx.save(); ctx.translate(-s * 0.34, 0); ctx.rotate(Math.sin(t) * 0.3);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-s * 0.16, -s * 0.16); ctx.lineTo(-s * 0.14, s * 0.16); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(-s * 0.05, -s * 0.18); ctx.quadraticCurveTo(s * 0.02, -s * 0.33, s * 0.12, -s * 0.18); ctx.fill(); ctx.stroke();
  const g = ctx.createLinearGradient(0, -s * 0.2, 0, s * 0.25);
  g.addColorStop(0, '#9a8670'); g.addColorStop(1, '#e8d6b8');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, s * (0.38 + fat), s * (0.21 + fat), 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(60,40,30,0.3)';
  for (const [x, y] of [[-0.12, -0.08], [0.02, -0.11], [-0.2, 0.02]]) { ctx.beginPath(); ctx.arc(x * s, y * s, s * 0.03, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  for (const k of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 0.33, s * 0.05 * k + s * 0.03);
    ctx.quadraticCurveTo(s * 0.48, s * 0.1 * k + s * 0.05, s * 0.5 + Math.sin(t + k) * s * 0.04, s * 0.2 * k + s * 0.06); ctx.stroke();
  }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * 0.2, -s * 0.06, s * 0.07, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(s * 0.22, -s * 0.05, s * 0.035, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(s * 0.21, -s * 0.15); ctx.lineTo(s * 0.29, -s * 0.12); ctx.stroke();  // a sneaky brow
  ctx.beginPath(); ctx.arc(s * 0.3, s * 0.07, s * 0.06, 0.2, Math.PI * 0.8); ctx.stroke();
  ctx.restore();
  if (eaten > 0) {
    ctx.save(); ctx.font = `800 15px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(20,10,30,0.6)'; rr(ctx, cx - 20, cy - s * 0.62, 40, 20, 10); ctx.fill();
    ctx.fillStyle = '#fff4d6'; ctx.fillText('●' + eaten, cx, cy - s * 0.52);
    ctx.restore();
  }
}

function drawExit(cx, cy, open, scl) {
  const s = TS * (scl || 1), t = G.time;
  ctx.save(); ctx.translate(cx, cy);
  if (open) {
    ctx.save(); ctx.rotate(t * 0.8);
    ctx.fillStyle = 'rgba(255,240,170,0.28)';
    for (let k = 0; k < 8; k++) { ctx.rotate(TAU / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * 0.7, -s * 0.09); ctx.lineTo(s * 0.7, s * 0.09); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    const gl = ctx.createRadialGradient(0, 0, 2, 0, 0, s * 0.6);
    gl.addColorStop(0, 'rgba(255,250,200,0.9)'); gl.addColorStop(1, 'rgba(255,250,200,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, TAU); ctx.fill();
  }
  const bob = open ? Math.sin(t * 4) * 2 : 0;
  ctx.translate(0, bob);
  const g = ctx.createRadialGradient(-s * 0.1, -s * 0.1, 2, 0, 0, s * 0.42);
  if (open) { g.addColorStop(0, '#fffbe8'); g.addColorStop(0.5, '#ffd1ec'); g.addColorStop(1, '#b6a0ff'); }
  else { g.addColorStop(0, '#c9c4cf'); g.addColorStop(1, '#6f6a7a'); }
  ctx.fillStyle = g; ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(0, 0, s * 0.4, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = open ? '#9a5fb8' : '#4a4652'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let a = 0; a < TAU * 2.4; a += 0.2) { const r = s * 0.36 * (1 - a / (TAU * 2.6)); const x = Math.cos(a + t * (open ? 1.5 : 0)) * r, y = Math.sin(a + t * (open ? 1.5 : 0)) * r; a ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  if (!open) {
    ctx.fillStyle = '#2b2733'; ctx.beginPath(); ctx.arc(0, 0, s * 0.08, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawMagic(cx, cy, i) {
  const st = C ? C.magic.state : 'dormant', t = G.time;
  const s = TS;
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = st === 'spent' ? '#3a3f48' : '#14373f'; ctx.fillRect(-s / 2, -s / 2, s, s);
  let col;
  if (st === 'active') col = `hsl(${(t * 220 + i * 25) % 360},90%,70%)`;
  else if (st === 'spent') col = '#7c8590';
  else col = '#4fe3e0';
  if (st === 'active') { ctx.shadowColor = col; ctx.shadowBlur = 14; }
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = 6;
  const sway = st === 'spent' ? 0 : Math.sin(t * 2 + i) * 3;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.45); ctx.lineTo(sway * 0.5, 0); ctx.lineTo(sway, -s * 0.35);
  ctx.moveTo(sway * 0.5, s * 0.05); ctx.lineTo(-s * 0.25 + sway, -s * 0.2);
  ctx.moveTo(sway * 0.5, s * 0.12); ctx.lineTo(s * 0.26 + sway, -s * 0.12);
  ctx.moveTo(-s * 0.25 + sway, -s * 0.2); ctx.lineTo(-s * 0.3 + sway, -s * 0.36);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = st === 'spent' ? '#9aa2ac' : '#ffffff';
  for (const [x, y] of [[sway, -s * 0.37], [-s * 0.3 + sway, -s * 0.38], [s * 0.26 + sway, -s * 0.14]]) { ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill(); }
  ctx.restore();
}

function drawKey(cx, cy, color, scl) {
  const s = TS * (scl || 1);
  ctx.save(); ctx.translate(cx, cy + Math.sin(G.time * 3) * 2); ctx.rotate(-0.5);
  ctx.fillStyle = color; ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(-s * 0.16, 0, s * 0.15, 0, TAU); ctx.fill(); ctx.stroke();

function hintText(h) {
  const move = G.touchMode ? 'Drag your finger to dig.' : 'Use the arrow keys to dig.';
  const slurp = G.touchMode ? 'Hold SLURP and drag to' : 'Hold SPACE + an arrow to';
  const bomb = G.touchMode ? 'Grab a puffer, then tap BOMB to drop it.' : 'Grab a puffer, then press B to drop it.';
  return h.replace('{move}', move).replace('{slurp}', slurp + ' grab without moving.').replace('{bomb}', bomb);
}
function drawHint() {
  const c = C;
  if (!c.L.hint || c.hintGone || c.phase !== 'play' || c.hintT > 9 || c.stuck >= STUCK_STEPS) return;
  const a = clamp(c.hintT * 3, 0, 1) * clamp((9 - c.hintT) * 2, 0, 1);
  const text = hintText(c.L.hint);
  const maxW = Math.min(W - 120, 820);
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `800 26px ${FONT}`;
  const lines = wrapLines(text, maxW - 60);
  const h = 30 + lines.length * 34;
  const x = (W - maxW) / 2, y = G.touchMode ? HUD_H + 14 : H - h - 26;   // touch: keep clear of the thumbs
  ctx.fillStyle = 'rgba(10,20,35,0.82)'; rr(ctx, x, y, maxW, h, 20); ctx.fill();
  ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 3; ctx.stroke();
  lines.forEach((ln, k) => txt(ln, W / 2, y + 32 + k * 34, 26, '#fff'));
  ctx.restore();
}
function drawStuck() {
  const c = C;
  if (c.phase !== 'play' || c.stuck < STUCK_STEPS || G.paused) return;
  const a = clamp((c.stuck - STUCK_STEPS) / 4, 0, 1);
  const pw = Math.min(W - 80, 520), ph = 150, px = (W - pw) / 2, py = G.touchMode ? HUD_H + 40 : H - ph - 30;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(10,20,35,0.86)'; rr(ctx, px, py, pw, ph, 22); ctx.fill();
  ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 3; ctx.stroke();
  txt('Boxed in? No way out!', W / 2, py + 34, 28, '#fff', 'center', 800);
  ctx.restore();
  button('stuckRetry', px + 50, py + 66, pw - 100, 64, G.touchMode ? '↻ TRY AGAIN' : '↻ TRY AGAIN  (R)', { act: restartCave, color: '#ffb347', size: 28, nav: false });
}
function wrapLines(text, maxW) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
function drawToast() {
  if (!G.toast) return;
  const k = G.toast.t, a = clamp(k * 5, 0, 1) * clamp((2.6 - k) * 3, 0, 1);
  const s = 1 + Math.max(0, 0.25 - k) * 1.5;
  const hintUp = G.touchMode && C && C.L.hint && !C.hintGone && C.phase === 'play' && C.hintT < 9;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, HUD_H + (hintUp ? 170 : 70)); ctx.scale(s, s);
  txt(G.toast.text, 0, 0, fitSize(G.toast.text, W - 80, 42), G.toast.color, 'center', 800, 8);
  ctx.restore();
}

function drawOverlay(kind) {
  const c = C;
  if (kind === 'paused') {
    dim(0.55);
    const pw = 460, ph = 470, px = (W - pw) / 2, py = (H - ph) / 2;

    const pw = 520, ph = canSkip ? 420 : 350, px = (W - pw) / 2, py = (H - ph) / 2;

function drawCover(img) {

  let w, h;
  if (ir > sr) { h = H; w = H * ir; } else { w = W; h = W / ir; }

  ctx.drawImage(img, (W - w) / 2 + drift, (H - h) / 2, w, h);
}
function drawLogo(x, y, size) {
  ctx.save();

  const cols = ['#ff7aa8', '#ff9ec0', '#ffd23f', '#ff7aa8', '#fff', '#8ff7ff', '#5fd4ff', '#ffd23f', '#ff9ec0'];
  letters.forEach((l, k) => {
    const bob = Math.sin(G.time * 3 + k * 0.6) * size * 0.04;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.2; ctx.strokeStyle = INK; ctx.strokeText(l, px, bob);

    px += widths[k];

    case T.BOMBITEM: drawPuffer(x, y, false, 0, s); break;
    case T.CLOCK: drawClock(x, y, s); break;
    case T.WALL: ctx.drawImage(SPR.wall, x - 28, y - 28, 56, 56); break;
  }
  ctx.restore();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  buttons = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#06161d'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * offX, DPR * offY);
  if (G.screen === 'title') drawTitle();
  else if (G.screen === 'caves') drawCaves();
  else if (G.screen === 'help') drawHelp();
  else if (G.screen === 'play' && C) {
    drawCave();
    if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,240,${G.flash * 0.6})`; ctx.fillRect(0, HUD_H, W, H - HUD_H); }
    drawHUD();
    drawHint();
    drawStuck();
    drawToast();
    drawTouchControls();
    const ov = playOverlay();
    if (ov) drawOverlay(ov);
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   DEBUG + TUNING HOOKS (see README)
   ============================================================ */
function validateAll(ticks) {
  const keep = C, keepOff = OFF, out = [];
  G.silent = true;
  for (let idx = 0; idx < LEVELS.length; idx++) {
    C = newCave(idx); OFF = [-C.w, 1, C.w, -1];
    const c = C;
    let pearls = 0, jellies = 0, fish = 0, crabs = 0;
    for (let i = 0; i < c.n; i++) { if (c.t[i] === T.PEARL) pearls++; if (c.t[i] === T.JELLY) jellies++; if (c.t[i] === T.FISH) fish++; if (c.t[i] === T.CRAB) crabs++; }
    // can the lotl dig from the start to the exit (walls, bedrock and gates block)?
    const seen = new Uint8Array(c.n), q = [c.entry]; seen[c.entry] = 1;
    let reachPearls = 0, reachExit = false;
    while (q.length) {
      const cur = q.pop();
      for (const o of OFF) {
        const nb = cur + o, tn = c.t[nb];
        if (seen[nb] || tn === T.STEEL || tn === T.WALL || tn === T.GATE || tn === T.MAGIC) continue;
        seen[nb] = 1; if (tn === T.PEARL) reachPearls++; if (tn === T.EXIT) { reachExit = true; continue; }
        q.push(nb);
      }
    }
    c.phase = 'play'; setCell(c.entry, T.PLAYER); c.player.i = c.entry;
    for (let k = 0; k < (ticks || 40); k++) stepCave();
    out.push({ cave: idx + 1, name: c.L.name, size: (c.w - 2) + 'x' + (c.h - 2), need: c.need, pearls, reachPearls, jellies, crabs, fish, reachExit, aliveIdle: c.player.alive });
  }
  G.silent = false;
  C = keep; OFF = keepOff;
  G.parts = []; G.floats = []; G.toast = null;
  return out;
}
window.LotlDash = {
  G, LEVELS, T, save,
  get C() { return C; },
  start: n => startCave(n - 1),
  validate: validateAll,
  step: () => stepCave(),
  hold: (code, on) => { if (on) keysDown.add(code); else keysDown.delete(code); },
  unlockAll() { save.unlocked = LEVELS.length; persist(); },
  givePearls(n) { if (C) { C.pearls += n || C.need; checkExit(); } },
  reset() { localStorage.removeItem(SAVE_KEY); location.reload(); }
};

resize();
if (document.fonts && document.fonts.load) document.fonts.load(`800 30px "Baloo 2"`).catch(() => {});
requestAnimationFrame(frame);
</script>
